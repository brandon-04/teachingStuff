<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div id="main-box">
        <h1>Create Account</h1>

        <input id="new-forename-input" type="text" placeholder="Forename">
        <input id="new-surname-input" type="text" placeholder="Surname">
        <input id="new-email-input" type="email" placeholder="email">
        <input id="new-password-input" type="password" placeholder="password">
        <input id="new-password-confirm-input" type="password" placeholder="password again">
        
        <button id="log-in-button">Log In</button>
        
        <div id="create-new-container">
            <p>Already have an account?</p>
            <a href="index.html"><button id="create-new-account">Sign in</button></a>
        </div>
    </div>
</body>
</html>
