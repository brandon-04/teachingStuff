<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Website</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div id="main-box">
        <h1 id="weather-title">weather</h1>
        <div id="search-container">
            <input id="city-input" type="text" placeholder="Enter a city">
            <button id="search-button"></button>
        </div>
        <div id="weather-image-box"></div>
        <div id="weather-info-box">
            <h1 id="country-display">country:</h1>
            <h1 id="city-display">city:</h1>
            <h1 id="condition-display">condition:</h1>
            <h1 id="windspeed-display">wind-speed:</h1>
            <h1 id="temperature-display">temperature: °C</h1>
        </div>
    </div>
</body>
</html>
